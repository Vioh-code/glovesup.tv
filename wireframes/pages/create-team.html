<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create team — GlovesUP</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/screens.css" />
</head>
<body class="bg-arena">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="../index.html">Gloves<span>UP</span></a>
      <nav class="site-nav" aria-label="Main">
        <a class="site-nav__link" href="dashboard.html">Dashboard</a>
        <a class="site-nav__link" href="my-battles.html">Battles</a>
        <a class="site-nav__link site-nav__link--active" href="teams.html" aria-current="page">Teams</a>
        <a class="site-nav__link" href="leaderboards.html">Leaderboards</a>
      </nav>
      <div class="site-header__actions"><a class="btn btn--link" href="settings.html">Settings</a><a class="avatar-btn" href="profile.html" aria-label="Your profile"><img src="../images/avatars/185.webp" alt="" /></a></div>
    </div>
  </header>

  <main class="page">
    <div class="container container--sm" style="max-width:var(--content-max-width)">
      <div class="page-head"><div><h1>Create a team</h1><p class="page-head__sub">You become the owner.</p></div></div>
      <section class="card ">
        <form onsubmit="return false">
          <div class="field"><label class="field__label" for="tn">Team name</label><input class="input" id="tn" /><span class="field__hint">Checked against the banned-word list.</span></div>
          <div class="field"><label class="field__label" for="tb">Description</label><textarea class="textarea" id="tb" rows="4"></textarea></div>
          <div class="field"><label class="field__label" for="tj">Joining</label><select class="select" id="tj"><option>Open to applications</option><option>Invite only</option></select></div>
          <div class="form-actions"><button class="btn btn--primary" type="submit">Create team</button><a class="btn btn--ghost" href="teams.html">Cancel</a></div>
        </form>
      </section>

    </div>
  </main>
  <footer class="site-footer">
    <div class="site-footer__inner">
      <nav class="site-footer__links"><a href="#">Privacy</a><a href="#">Terms</a></nav>
      <span>&copy; 2026 GlovesUP</span>
    </div>
  <div class="screen-note">Screen S-T1 · feature F-B1 · verified email required</div>
  </footer>
</body>
</html>
