<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team settings — GlovesUP</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/screens.css" />
</head>
<body class="bg-arena">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="../index.html">Gloves<span>UP</span></a>
      <nav class="site-nav" aria-label="Main">
        <a class="site-nav__link" href="dashboard.html">Dashboard</a>
        <a class="site-nav__link" href="my-battles.html">Battles</a>
        <a class="site-nav__link site-nav__link--active" href="teams.html" aria-current="page">Teams</a>
        <a class="site-nav__link" href="leaderboards.html">Leaderboards</a>
      </nav>
      <div class="site-header__actions"><a class="btn btn--link" href="settings.html">Settings</a><a class="avatar-btn" href="profile.html" aria-label="Your profile"><img src="../images/avatars/185.webp" alt="" /></a></div>
    </div>
  </header>

  <main class="page">
    <div class="container container--sm" style="max-width:var(--content-max-width)">
      <div class="page-head"><div><h1>Team settings</h1><p class="page-head__sub">Owner only for ownership and deletion.</p></div></div>
      <section class="card ">
        <div class="field"><label class="field__label" for="ts">Joining</label><select class="select" id="ts"><option>Open to applications</option><option>Invite only</option></select></div>
        <div class="form-actions"><button class="btn btn--primary" type="button">Save</button></div>
      </section>
      <section class="card ">
        <div class="card__head"><h2 class="card__title card__title--sm">Pass ownership</h2></div>
        <div class="field"><label class="field__label" for="po">Officer</label><select class="select" id="po"><option>[Select an officer]</option></select></div>
        <button class="btn btn--ghost" type="button">Pass ownership</button>
        <hr class="divider" style="margin-block:var(--space-5)" />
        <div class="card__head"><h2 class="card__title card__title--sm">Disband team</h2></div>
        <p class="hint" style="margin-top:0">Past battles stay in the log. The team stops appearing in search.</p>
        <button class="btn btn--danger" type="button">Disband team</button>
      </section>

    </div>
  </main>
  <footer class="site-footer">
    <div class="site-footer__inner">
      <nav class="site-footer__links"><a href="#">Privacy</a><a href="#">Terms</a></nav>
      <span>&copy; 2026 GlovesUP</span>
    </div>
  <div class="screen-note">Screen S-T4 · feature F-B2</div>
  </footer>
</body>
</html>
