<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locked out — GlovesUP</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/screens.css" />
</head>
<body class="bg-arena">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="../index.html">Gloves<span>UP</span></a>
      <nav class="site-nav" aria-label="Main">
        <a class="site-nav__link" href="battle-log.html">Battle log</a>
        <a class="site-nav__link" href="teams.html">Teams</a>
        <a class="site-nav__link" href="leaderboards.html">Leaderboards</a>
      </nav>
      <div class="site-header__actions"><a class="btn btn--link" href="login.html">Log in</a><a class="btn btn--primary btn--sm" href="register.html">Register</a></div>
    </div>
  </header>

  <main class="auth bg-spotlight">
    <section class="card card--raised auth__card">
      <h1 class="auth__title">Can&rsquo;t get in?</h1>
      <p class="auth__sub">Tell us what happened and the team will help. You do not need to be logged in.</p>
      <form onsubmit="return false">
        <div class="field"><label class="field__label" for="le">Account email</label><input class="input" id="le" type="email" /></div>
        <div class="field"><label class="field__label" for="lr">What happened</label><select class="select" id="lr"><option>Account locked</option><option>Lost my MFA device</option><option>Lost access to my email</option><option>Other</option></select></div>
        <div class="field"><label class="field__label" for="ld">Details</label><textarea class="textarea" id="ld" rows="4"></textarea></div>
        <button class="btn btn--primary btn--block" type="submit" style="margin-top:var(--space-5)">Send request</button>
      </form>
      <p class="hint">This opens a case for staff. Reply goes to the email you enter.</p>
    </section>
  </main>
  <footer class="site-footer">
    <div class="site-footer__inner">
      <nav class="site-footer__links"><a href="#">Privacy</a><a href="#">Terms</a></nav>
      <span>&copy; 2026 GlovesUP</span>
    </div>
  <div class="screen-note">Screen S-P12 · features F-A3, F-G1</div>
  </footer>
</body>
</html>
